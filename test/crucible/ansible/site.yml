---
# Crucible cluster provisioning: RKE2 HA (3 servers + 3 agents) on Hetzner.
# Inventory is generated by terraform (inventory/hosts.ini).

- name: Wait for every node to accept SSH
  hosts: k8s
  gather_facts: false
  # MUST come before any play that gathers facts, and that ordering IS the fix.
  #
  # Terraform returns as soon as Hetzner has ASSIGNED the addresses, which is well before the
  # instances have booted far enough to run sshd. The next play gathers facts, so it opens a
  # session to every node in its first second: a node that is not listening yet is marked
  # UNREACHABLE and dropped for the WHOLE run — not retried, not failed loudly. That reads as
  # something else entirely further down. Observed twice out of two provisionings: one master went
  # unreachable, and the play that followed then failed on a DIFFERENT master because
  # `rke2-server` could not start — it was trying to join a cluster whose first server had never
  # bootstrapped. The visible error was three plays away from the cause.
  #
  # wait_for_connection rather than wait_for on port 22: it uses Ansible's own connection plugin,
  # so it proves what the later plays actually need (SSH accepted AND a usable Python), not merely
  # that something answers on the port.
  tasks:
    - name: Wait until the node answers over SSH
      ansible.builtin.wait_for_connection:
        # A fresh Hetzner instance is not worth probing in the first few seconds.
        delay: 5
        sleep: 5
        # Generous on purpose: this costs nothing when the node is already up (it returns on the
        # first successful connection), and the alternative is a 20-minute provisioning run
        # destroyed by a node that needed ten more seconds.
        timeout: 600

    # PREVENTIVE, unlike the wait above — this failure has not been observed, the SSH one has.
    # It is here because sshd comes up well before cloud-init finishes, and the very next play
    # runs `apt update_cache`: while cloud-init (and the unattended-upgrades it triggers) still
    # holds /var/lib/dpkg/lock-frontend, that task fails on "Could not get lock". Same family as
    # the bug above — racing the boot — and the same misleading shape, since the error names apt
    # rather than the timing. `cloud-init status --wait` is the supported way to ask.
    - name: Wait until cloud-init has finished, so apt is not locked under us
      ansible.builtin.command: cloud-init status --wait
      register: cloudinit
      # `--wait` exits non-zero when cloud-init ends in an error state. That is worth surfacing,
      # but not worth aborting a crucible provisioning over: the packages we need may well have
      # been installed regardless, and the next task will say so plainly if they were not.
      failed_when: false
      changed_when: false

    - name: Report a cloud-init that did not finish cleanly
      ansible.builtin.debug:
        msg: >-
          cloud-init reported rc={{ cloudinit.rc }} ({{ cloudinit.stdout | default('') | trim }}).
          Continuing; a genuine problem will surface in the package install that follows.
      when: cloudinit.rc | default(0) != 0

- name: Prepare all nodes
  hosts: k8s
  gather_facts: true
  roles:
    - common

# Before RKE2, not after: this partitions the workers' second raw disk and builds
# the LVM/thin/ZFS backends the node-local CSI drivers under test consume. Those
# devices must be settled before the kubelet starts, or a CSI node plugin can come
# up looking at a volume group that does not exist yet and cache the absence.
- name: Prepare the extra raw disk on the workers (LVM / thin LVM / ZFS)
  hosts: workers
  roles:
    - storage_prep

- name: Install RKE2 servers (first bootstraps, others join)
  hosts: masters
  serial: 1
  roles:
    - rke2_server

- name: Install RKE2 agents
  hosts: workers
  roles:
    - rke2_agent

- name: Wait for the full cluster and fetch the kubeconfig
  hosts: masters[0]
  tasks:
    - name: Wait until all nodes are Ready
      ansible.builtin.command:
        cmd: >
          /var/lib/rancher/rke2/bin/kubectl
          --kubeconfig /etc/rancher/rke2/rke2.yaml
          wait --for=condition=Ready node --all --timeout=60s
      register: nodes_ready
      retries: 20
      delay: 15
      until: nodes_ready.rc == 0
      changed_when: false

    # The destination is lane-aware: with no lane it is artifacts/kubeconfig exactly as before,
    # and a lane writes under artifacts/lanes/<lane>/ instead. Two lanes sharing one kubeconfig
    # path would silently aim every kubectl in the session at whichever cluster finished last.
    - name: Fetch kubeconfig
      ansible.builtin.fetch:
        src: /etc/rancher/rke2/rke2.yaml
        dest: "{{ crucible_artifacts_dir | default('../artifacts') }}/kubeconfig"
        flat: true

    - name: Point the kubeconfig at the first master's public IP
      delegate_to: localhost
      ansible.builtin.replace:
        path: "{{ crucible_artifacts_dir | default('../artifacts') }}/kubeconfig"
        regexp: "https://127\\.0\\.0\\.1:6443"
        replace: "https://{{ first_master_public_ip }}:6443"

    - name: Restrict kubeconfig permissions
      delegate_to: localhost
      ansible.builtin.file:
        path: "{{ crucible_artifacts_dir | default('../artifacts') }}/kubeconfig"
        mode: "0600"
