# Rook Ceph cluster for crucible.
# Placement per the crucible contract:
#   mon + mgr    -> masters  (crystalbackup.io/node-role=master)
#   osd + mds    -> workers  (crystalbackup.io/node-role=worker)
# OSDs consume the raw hcloud volume attached to each worker (/dev/sdb).
# No CephObjectStore/RGW here — production (core/argocd-bseufr) runs none, and
# it isn't exercised until a milestone tests object-store backup; keeping the
# pool count low keeps 3x 40 GB OSDs comfortably at HEALTH_OK.
apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    # Pinned; bump together with ROOK_CHART_VERSION in ../deploy.sh.
    image: quay.io/ceph/ceph:v20.2.5
  dataDirHostPath: /var/lib/rook
  # The CSI keys are the ones the KERNEL loads (krbd map, kernel CephFS mount), and Rook 1.21 mints
  # them as aes256k whenever Ceph supports that type (19.2.7 and every 20.x). The Ubuntu 24.04 LTS
  # kernel (6.8) cannot load an aes256k key: every map and mount failed with "adding ceph secret key
  # to kernel failed: Invalid argument". Measured on this platform, and fixed in place by exactly
  # this setting (rotation to keyGeneration 2, key length 60 -> 40, both mounts then succeeded).
  # Daemon keys are never handed to a kernel and keep Rook's default.
  # Consequence, accepted: the monitors must keep allowing the aes cipher, which Ceph reports as
  # AUTH_INSECURE_KEYS_ALLOWED / AUTH_INSECURE_KEYS_CREATABLE, and the four CSI entities themselves
  # as AUTH_INSECURE_CLIENT_KEY_TYPE — deploy.sh mutes those three by name.
  security:
    cephx:
      csi:
        keyType: aes
  # BLUESTORE_SLOW_OP_ALERT stays raised for bluestore_slow_ops_warn_lifetime after the LAST slow op,
  # and Ceph's default is 86400 s: one latency blip on a shared cloud disk during the seed kept
  # HEALTH_WARN for a day and failed the infra health check of a run whose 92 other checks passed.
  # 120 s lets a one-off blip clear inside that check's 5-minute window, while an OSD that keeps
  # stalling keeps re-raising the alert and still fails it. The threshold (1 op) is left alone.
  cephConfig:
    osd:
      bluestore_slow_ops_warn_lifetime: "120"
  mon:
    count: 3
    allowMultiplePerNode: false
  mgr:
    count: 2
    allowMultiplePerNode: false
  dashboard:
    enabled: false
  monitoring:
    enabled: false
  crashCollector:
    disable: true
  placement:
    mon:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: crystalbackup.io/node-role
                  operator: In
                  values: ["master"]
    mgr:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: crystalbackup.io/node-role
                  operator: In
                  values: ["master"]
    osd:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: crystalbackup.io/node-role
                  operator: In
                  values: ["worker"]
  storage:
    useAllNodes: true
    useAllDevices: false
    # The hcloud volume shows up as /dev/sdb on the workers (masters have none).
    # DELIBERATELY narrow — sdb and nothing else. Workers also carry a SECOND raw
    # volume at /dev/sdc, carved up by the `storage_prep` ansible role for the
    # node-local CSI drivers under test (LVM / thin-LVM / ZFS). A wider filter
    # (`^sd[bc]$`, what this used to be) hands sdc to an OSD before the driver
    # ever sees it, and the compatibility campaign then measures nothing.
    # Do not widen it: add explicit device names instead.
    deviceFilter: "^sdb$"
---
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: blockpool
  namespace: rook-ceph
spec:
  failureDomain: host
  replicated:
    size: 3
---
apiVersion: ceph.rook.io/v1
kind: CephFilesystem
metadata:
  name: cephfs
  namespace: rook-ceph
spec:
  metadataPool:
    replicated:
      size: 3
  dataPools:
    - name: data0
      failureDomain: host
      replicated:
        size: 3
  preserveFilesystemOnDelete: false
  metadataServer:
    activeCount: 1
    activeStandby: true
    placement:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: crystalbackup.io/node-role
                  operator: In
                  values: ["worker"]
