# Wave 3 — OpenEBS LocalPV ZFS StorageClass + VolumeSnapshotClass.
#
# WITH a VolumeSnapshotClass. ZFS snapshots are the cheapest case in the whole matrix: they are
# native, constant-time and genuinely copy-on-write, so this is the driver most likely to come
# back COMPATIBLE rather than COMPATIBLE_COPIE_COMPLETE from csi-probe.sh --copy-probe. If ZFS
# reports a full copy, suspect the probe's timing heuristic before suspecting ZFS.
#   https://github.com/openebs/zfs-localpv/blob/develop/deploy/sample/zfssnapclass.yaml
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-zfs
provisioner: zfs.csi.openebs.io
parameters:
  poolname: crucible-zpool
  # fstype "zfs" means the volume IS a ZFS dataset (not a zvol formatted with ext4/xfs). That is
  # the mode where snapshot and clone are native ZFS operations rather than block-level copies,
  # which is the property this lane is here to observe.
  fstype: zfs
  recordsize: 128k
  compression: "off"
  dedup: "off"
reclaimPolicy: Delete
allowVolumeExpansion: true
# Node-local: the dataset lives in one worker's zpool.
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: openebs-zfs
driver: zfs.csi.openebs.io
deletionPolicy: Delete
