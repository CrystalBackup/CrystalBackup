{{- if .Values.networkPolicy.create }}
{{- $apiPorts := splitList "," (include "crystal-backup.apiServerPorts" .) }}
################################################################################
# Network posture for crystal-backup-system (spec/03-security-and-tenancy.md §7).
#
# Why this matters more here than in a typical operator: every mover receives the location's S3
# credentials verbatim, and operator-minted repo-scoped credentials are NOT coming (adr/0019 —
# a shared repository is dedup-shared, so no storage policy can carve out a namespace). That
# makes this file permanent load-bearing security rather than a stopgap: invariant I4 names
# three compensating controls — no token, NetworkPolicy egress, Job lifetime — and before this
# file existed only the first was real. A compromised mover could reach any cluster-internal
# service.
#
# The shape is default-deny plus narrow allowances, so a pod shape added later starts with no
# connectivity and has to be granted it deliberately, rather than inheriting everything.
#
# ENFORCEMENT IS THE CNI'S JOB. Some CNIs (notably kind's default kindnet) accept NetworkPolicy
# objects and enforce nothing. These policies are therefore not a control you can assume from
# their presence — verify on the target CNI. The crucible runs on Canal, which does enforce.
################################################################################
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "crystal-backup.fullname" . }}-default-deny
  namespace: {{ include "crystal-backup.namespace" . }}
  labels:
    {{- include "crystal-backup.labels" . | nindent 4 }}
spec:
  # Empty selector = every pod in the namespace, including ones that do not exist yet.
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
################################################################################
# DNS for every pod in the namespace. Without it nothing resolves the S3 endpoint or the API
# server, and every allowance below is moot.
################################################################################
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "crystal-backup.fullname" . }}-allow-dns
  namespace: {{ include "crystal-backup.namespace" . }}
  labels:
    {{- include "crystal-backup.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
---
################################################################################
# Movers: egress to object storage on 443, and NOWHERE inside the cluster.
#
# `except` carries the actual security property. Allowing 0.0.0.0/0:443 outright would let a
# compromised mover reach in-cluster services on 443 — the API server, an admission webhook,
# another tenant's workload — which is the SSRF pivot §7 exists to block. The excluded ranges
# default to the private address space because pod, service and node networks all live there;
# an S3 endpoint on a private address needs an explicit extraEgress entry, which is the right
# trade: the default is closed and the exception is visible in values.
################################################################################
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "crystal-backup.fullname" . }}-mover-egress
  namespace: {{ include "crystal-backup.namespace" . }}
  labels:
    {{- include "crystal-backup.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: {{ .Values.networkPolicy.moverManagedByValue }}
  policyTypes: [Egress]
  egress:
    - ports:
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range .Values.networkPolicy.clusterInternalCIDRs }}
              - {{ . | quote }}
              {{- end }}
    {{- with .Values.networkPolicy.extraMoverEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
################################################################################
# Manifest movers ONLY: egress to the Kubernetes API server.
#
# The podSelector is what makes §7's "granted to crystal-manifest-mover pods only" real. It
# selects on crystalbackup.io/mover-role=manifest, which the controller stamps on the manifest
# Job and on nothing else — a data mover, which holds the repository credentials, is not
# selected by this policy and so cannot reach the API server at all.
#
# Both ports by default (networkPolicy.apiServerPorts). kube-proxy DNATs the `kubernetes` Service
# from 443 to the API server's Endpoints — 6443 on k3s, RKE2 and kubeadm — BEFORE the CNI
# evaluates egress, so a rule naming only 443 matches nothing on most clusters.
################################################################################
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "crystal-backup.fullname" . }}-manifest-mover-apiserver
  namespace: {{ include "crystal-backup.namespace" . }}
  labels:
    {{- include "crystal-backup.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      crystalbackup.io/mover-role: manifest
  policyTypes: [Egress]
  egress:
    - ports:
        {{- range $apiPorts }}
        - port: {{ . | int }}
          protocol: TCP
        {{- end }}
      to:
        {{- if .Values.networkPolicy.apiServerCIDRs }}
        {{- range .Values.networkPolicy.apiServerCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- else }}
        # No apiServerCIDRs configured: allow the port broadly rather than break the manifest
        # mover outright. Narrow this to the API server's address on a cluster where you know
        # it — an unnarrowed rule is a working default, not a good one.
        - ipBlock:
            cidr: 0.0.0.0/0
        {{- end }}
---
################################################################################
# The operator: the API server, plus the object-storage endpoints it probes. Ingress on the
# webhook and metrics ports.
#
# THE EGRESS HAS EXACTLY TWO DESTINATIONS, and until 0.6.2 the rendered object did not say so. It
# listed `port: 443` twice — once from apiServerPort, which defaulted to 443, and once hardcoded
# for the storage probes — with nothing to tell a reader which entry served which. Kubernetes did
# not mind. A human auditing the policy could not tell whether one of them was a leftover.
#
# So the two destinations are now named, and the shape follows what they actually are:
#
#   * with no apiServerCIDRs, both destinations are 0.0.0.0/0 — literally the same allowance, so
#     it is written ONCE, with the union of the ports and no repeats;
#   * with apiServerCIDRs set, they are genuinely different destinations and get one rule each.
#
# `apiServerCIDRs` now narrows the operator too. It used to narrow only the manifest-mover policy
# above while this one stayed at 0.0.0.0/0 — an asymmetry the name gave no hint of, and one that
# quietly made the value worth less than it looked. Object storage keeps its own unnarrowed rule,
# because an S3 endpoint is not the API server and no CIDR list of API server addresses should be
# read as covering it.
################################################################################
{{- $operatorPorts := $apiPorts }}
{{- if not (has "443" $operatorPorts) }}
{{- $operatorPorts = append $operatorPorts "443" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "crystal-backup.fullname" . }}-operator
  namespace: {{ include "crystal-backup.namespace" . }}
  labels:
    {{- include "crystal-backup.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "crystal-backup.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  egress:
    {{- if .Values.networkPolicy.apiServerCIDRs }}
    # The Kubernetes API server, narrowed to networkPolicy.apiServerCIDRs.
    - ports:
        {{- range $apiPorts }}
        - port: {{ . | int }}
          protocol: TCP
        {{- end }}
      to:
        {{- range .Values.networkPolicy.apiServerCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
    # Object storage on 443: the location reachability probes the operator runs before it hands a
    # location to a mover. NOT narrowed by apiServerCIDRs — a bucket endpoint is somewhere else
    # entirely, and it is usually outside the cluster.
    - ports:
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
    {{- else }}
    # Two destinations, one rule, because with no apiServerCIDRs they are the same allowance:
    #   * the Kubernetes API server, on networkPolicy.apiServerPorts (443 and 6443 by default);
    #   * object storage on 443, for the location reachability probes.
    # The operator is trusted with cluster-wide reads by design, so it is not confined the way a
    # mover is. Narrow the first destination with networkPolicy.apiServerCIDRs.
    - ports:
        {{- range $operatorPorts }}
        - port: {{ . | int }}
          protocol: TCP
        {{- end }}
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
    {{- end }}
    {{- with .Values.networkPolicy.extraOperatorEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  ingress:
    # Webhooks, called by the API server.
    - ports:
        - port: {{ .Values.networkPolicy.webhookPort }}
          protocol: TCP
    # Metrics, from the monitoring namespace only when one is named.
    - ports:
        - port: {{ .Values.networkPolicy.metricsPort }}
          protocol: TCP
      {{- with .Values.networkPolicy.monitoringNamespace }}
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      {{- end }}
{{- end }}
