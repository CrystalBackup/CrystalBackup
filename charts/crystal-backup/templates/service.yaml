{{- if .Values.metrics.service.create }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "crystal-backup.fullname" . }}-metrics
  namespace: {{ include "crystal-backup.namespace" . }}
  labels:
    {{- include "crystal-backup.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  type: {{ .Values.metrics.service.type }}
  ports:
    - name: https
      port: {{ .Values.metrics.port }}
      targetPort: https
      protocol: TCP
  selector:
    {{- include "crystal-backup.selectorLabels" . | nindent 4 }}
    control-plane: controller-manager
{{- end }}
{{- if .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "crystal-backup.fullname" . }}
  namespace: {{ include "crystal-backup.namespace" . }}
  labels:
    {{- include "crystal-backup.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  endpoints:
    - path: /metrics
      port: https
      scheme: https
      # honorLabels is REQUIRED here, and its absence silently defeated the whole tenancy story.
      #
      # A ServiceMonitor attaches the target's own labels — namespace, pod, service, container —
      # and with honorLabels false (the default) the TARGET wins every collision: the operator's
      # namespace overwrites the metric's, and the real value survives only as
      # `exported_namespace`. So every crystalbackup_ series arrived carrying
      # namespace="crystal-backup-system", for every tenant on the cluster.
      #
      # Nothing looked broken, which is why this needed a real Prometheus to find. The alert
      # expressions still joined — both sides of `on (namespace, …)` carried the same wrong value
      # — so BackupMissed fired correctly and then named the operator's namespace in its summary,
      # routing every tenant's page to the same place. The tenant dashboard's $namespace variable
      # offered exactly one choice. Every metric this project emits is specified to be
      # tenant-attributable (R19, spec/05-observability.md §1); at the scrape, none of them were.
      honorLabels: true
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        # The metrics server presents a self-signed cert (no cert-manager dependency
        # in M0). Verify against the in-cluster CA / a provided bundle in production.
        insecureSkipVerify: true
  selector:
    matchLabels:
      {{- include "crystal-backup.selectorLabels" . | nindent 6 }}
      control-plane: controller-manager
  namespaceSelector:
    matchNames:
      - {{ include "crystal-backup.namespace" . }}
{{- end }}
