    controller-gen.kubebuilder.io/version: v0.21.0
  name: backups.crystalbackup.io
spec:
  group: crystalbackup.io
  names:
    kind: Backup
    listKind: BackupList
    plural: backups
    shortNames:
    - bk
    singular: backup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.locationRef.name
      name: Location
      type: string
    - jsonPath: .status.backupTime
