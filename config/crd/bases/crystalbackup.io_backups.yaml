    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Backup is the execution unit and restore-point projection (source
          of truth = the repository).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Backup
            properties:
              locationRef:
                description: |-
                  locationRef is the backup location. On the namespace plane it is a BackupLocation;
                  a cluster-origin Backup references a ClusterBackupLocation.
                properties:
                  kind:
                    default: BackupLocation
                    description: kind of the referenced location.
                    enum:
                    - BackupLocation
                    - ClusterBackupLocation
                    type: string
                  name:
                    description: name of the referenced location.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              run:
                description: |-
                  run is the run configuration MATERIALIZED by whatever created this Backup — a
                  ClusterBackup fan-out or a BackupSchedule stamp (adr/0017 §5). Identity still lives in
                  the fields above; this is the intent, copied down once at creation rather than pulled
                  from a parent at every reconcile.

                  It is a POINTER because absent and empty must stay distinguishable. Absent means "this
                  object predates materialization, or was projected" — the controller falls back to
                  pulling the parent ClusterBackup, which is the only way an object created before this
                  field existed still executes. An empty struct means "materialized, and every knob was
                  left at its default", which must NOT trigger the fallback.

                  DISCOVERY MUST NEVER SET OR OWN THIS FIELD. A projection is reconstructed from restic
                  snapshots alone, and no selector, manifest option or hook command was ever written to
                  the repository; an SSA field manager that owns a field it cannot reproduce would fight
                  the execution controller over the object forever (adr/0017 §2). Projections leave it
                  absent, and the crystalbackup.io/projected annotation stops them executing anyway.
                properties:
                  backoffLimit:
                    description: backoffLimit for mover Jobs.
                    format: int32
                    type: integer
                  hooks:
                    description: hooks are exec hooks around snapshotting (R16).
                    properties:
                      honorAnnotations:
                        description: |-
                          honorAnnotations enables the crystalbackup.io/pre-backup-* and post-backup-* pod
                          annotations. It is opt-in because it delegates WHAT the operator execs to whoever can
                          annotate a pod in the backed-up namespace. When a pod carries them they take precedence and
                          the hooks below are skipped for that pod — never merged (the same rule Velero applies).
                        type: boolean
                      post:
                        description: post hooks run after snapshotting.
                        items:
                          description: |-
                            Hook is an exec hook run in a selected pod around snapshotting (R16). Candidate pods are those
                            MOUNTING the volumes being snapshotted, always in the CR's own namespace; podSelector narrows
                            that set further, and an empty selector means "every pod holding this data".
                          properties:
                            command:
                              description: |-
                                command to run, as an argv. It is exec'd directly, NOT through a shell, so pipes and
                                redirections need an explicit interpreter (e.g. ["sh","-c","..."]).
                              items:
                                type: string
                              minItems: 1
                              type: array
                            container:
                              description: container name to exec into. Empty uses
                                the pod's FIRST container.
                              type: string
                            onError:
                              default: Fail
                              description: onError governs whether a failure fails
                                the backup or is tolerated.
                              enum:
                              - Fail
                              - Continue
                              type: string
                            podSelector:
                              description: |-
                                podSelector selects the pod(s) to exec into, among those mounting the backed-up volumes.
                                Empty matches them all.
                              properties:
                                matchExpressions:
                                  description: matchExpressions is a list of label
                                    selector requirements. The requirements are ANDed.
                                  items:
                                    description: |-
                                      A label selector requirement is a selector that contains values, a key, and an operator that
                                      relates the key and values.
                                    properties:
                                      key:
                                        description: key is the label key that the
                                          selector applies to.
                                        type: string
                                      operator:
                                        description: |-
                                          operator represents a key's relationship to a set of values.
                                          Valid operators are In, NotIn, Exists and DoesNotExist.
                                        type: string
                                      values:
                                        description: |-
                                          values is an array of string values. If the operator is In or NotIn,
                                          the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                          the values array must be empty. This array is replaced during a strategic
                                          merge patch.
                                        items:
                                          type: string
                                        type: array
                                        x-kubernetes-list-type: atomic
                                    required:
                                    - key
                                    - operator
                                    type: object
                                  type: array
                                  x-kubernetes-list-type: atomic
                                matchLabels:
                                  additionalProperties:
                                    type: string
                                  description: |-
                                    matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                    map is equivalent to an element of matchExpressions, whose key field is "key", the
                                    operator is "In", and the values array contains only "value". The requirements are ANDed.
                                  type: object
                              type: object
                              x-kubernetes-map-type: atomic
                            timeout:
                              default: 30s
                              description: |-
                                timeout for the hook, bounding how long the application stays quiesced. It defaults to 30s
                                rather than to the zero value on purpose: this is a non-pointer duration, so an omitted
                                timeout would arrive as 0s, and a literal zero deadline expires immediately — every hook
                                that did not set one would fail before it ran.
                              type: string
                          required:
                          - command
                          type: object
                        type: array
                      pre:
                        description: pre hooks run before snapshotting.
                        items:
                          description: |-
                            Hook is an exec hook run in a selected pod around snapshotting (R16). Candidate pods are those
                            MOUNTING the volumes being snapshotted, always in the CR's own namespace; podSelector narrows
                            that set further, and an empty selector means "every pod holding this data".
                          properties:
                            command:
                              description: |-
                                command to run, as an argv. It is exec'd directly, NOT through a shell, so pipes and
                                redirections need an explicit interpreter (e.g. ["sh","-c","..."]).
                              items:
                                type: string
                              minItems: 1
                              type: array
                            container:
                              description: container name to exec into. Empty uses
                                the pod's FIRST container.
                              type: string
                            onError:
                              default: Fail
                              description: onError governs whether a failure fails
                                the backup or is tolerated.
                              enum:
                              - Fail
                              - Continue
                              type: string
                            podSelector:
                              description: |-
                                podSelector selects the pod(s) to exec into, among those mounting the backed-up volumes.
                                Empty matches them all.
                              properties:
                                matchExpressions:
                                  description: matchExpressions is a list of label
                                    selector requirements. The requirements are ANDed.
                                  items:
                                    description: |-
                                      A label selector requirement is a selector that contains values, a key, and an operator that
                                      relates the key and values.
                                    properties:
                                      key:
                                        description: key is the label key that the
                                          selector applies to.
                                        type: string
                                      operator:
                                        description: |-
                                          operator represents a key's relationship to a set of values.
                                          Valid operators are In, NotIn, Exists and DoesNotExist.
                                        type: string
                                      values:
                                        description: |-
                                          values is an array of string values. If the operator is In or NotIn,
                                          the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                          the values array must be empty. This array is replaced during a strategic
                                          merge patch.
                                        items:
                                          type: string
                                        type: array
                                        x-kubernetes-list-type: atomic
                                    required:
                                    - key
                                    - operator
                                    type: object
                                  type: array
                                  x-kubernetes-list-type: atomic
                                matchLabels:
                                  additionalProperties:
                                    type: string
                                  description: |-
                                    matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                    map is equivalent to an element of matchExpressions, whose key field is "key", the
                                    operator is "In", and the values array contains only "value". The requirements are ANDed.
                                  type: object
                              type: object
                              x-kubernetes-map-type: atomic
                            timeout:
                              default: 30s
                              description: |-
                                timeout for the hook, bounding how long the application stays quiesced. It defaults to 30s
                                rather than to the zero value on purpose: this is a non-pointer duration, so an omitted
                                timeout would arrive as 0s, and a literal zero deadline expires immediately — every hook
                                that did not set one would fail before it ran.
                              type: string
                          required:
                          - command
                          type: object
                        type: array
                      serviceAccountName:
                        description: |-
                          serviceAccountName is a ServiceAccount IN THE BACKED-UP NAMESPACE that the operator
                          IMPERSONATES to run these hooks. It is how the confinement invariant of
                          03-security-and-tenancy.md §5 — "users can only make the platform run commands they can
                          already run themselves" — stops being prose and becomes something the API server enforces.

                          The namespace is NOT a field and never will be: it is always the namespace being backed up,
                          derived from the pod the hook targets. A settable namespace would be a cross-tenant hole by
                          construction, so the only degree of freedom is WHICH ServiceAccount inside the tenant's own
                          namespace — one they (or an admin) created and granted `create pods/exec` on.

                          Empty means "run as the operator itself", which is the pre-M5 behaviour and stays available
                          on the CLUSTER plane, where hooks are admin-authored. On the NAMESPACE plane it is required:
                          a tenant-authored hook with no identity to run as is rejected rather than silently escalated
                          to the operator's own privileges.

                          It governs annotation-sourced hooks too (honorAnnotations). A pod annotation supplies the
                          command, never the identity — so even there, the command runs with exactly the rights the
                          namespace granted this ServiceAccount.
                        type: string
                    type: object
                  includeManifests:
                    default: true
                    description: includeManifests also captures namespace manifests
                      (default true).
                    type: boolean
                  manifestOptions:
                    description: manifestOptions tunes what the manifest dump captures
                      (03-security-and-tenancy.md §10).
                    properties:
                      excludeSecretData:
                        description: |-
                          excludeSecretData stores Secret manifests with data/stringData stripped and the
                          annotation crystalbackup.io/secret-data-excluded: "true". Restore recreates them
                          empty, carrying the same annotation, so a workload that needs the values fails
                          visibly instead of silently coming back with wrong ones.

                          This is an opt-out from a deliberate default: a full namespace recovery (R15) needs
                          the Secrets, and the control on them is the repository key — admin-only on the shared
                          DR repo, the user's own on a user location. Excluding the data trades recoverability
                          for a smaller blast radius if that key is ever compromised.
                        type: boolean
                    type: object
                  maxConcurrentMovers:
                    description: |-
                      maxConcurrentMovers caps parallel mover Jobs. The cap is CLUSTER-WIDE (it is checked
                      against every mover Job in the operator namespace, not just this run's), which is why it
                      stays off the tenant-facing BackupSchedule surface: a namespace user setting it would be
                      setting a platform-wide limit.
                    format: int32
                    type: integer
                  pvcSelector:
                    description: pvcSelector selects PVCs per namespace (default all).
                    properties:
                      exclude:
                        description: exclude is a list of PVC-name globs to remove.
                        items:
                          type: string
                        type: array
                      include:
                        description: include is a list of PVC-name globs to add.
                        items:
                          type: string
                        type: array
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: matchLabels selects PVCs by label.
                        type: object
                    type: object
                type: object
              scheduleRef:
                description: scheduleRef names the originating schedule (empty for
                  manual/ad-hoc).
                type: string
            required:
            - locationRef
            type: object
          status:
            description: status defines the observed state of Backup
            properties:
              backupTime:
                description: backupTime is the point-in-time of the snapshot set.
                format: date-time
                type: string
              completionTime:
                description: |-
                  completionTime is when the run reached a terminal phase — succeeded or failed alike. Absent
                  while it is still running.

                  It exists because there was no honest answer to "when did this Backup FAIL", and an alert
                  that has to ask that question was reading a timestamp that means something else. Neither of
                  the two candidates works:

                    - status.backupTime is the point-in-time of the SNAPSHOT SET, and every consumer reads it
                      that way — the last_success gauge, the schedule's lastSuccessTime roll-up, the restore
                      controller's point-in-time selection. It is only meaningful for a run that produced
                      something, and reusing it as a failure clock would make "when was this namespace last
                      captured" and "when did it last break" the same field.
                    - the Ready condition's lastTransitionTime is the run's START, not its end. A failing run
                      goes False(reason=InProgress) → False(reason=Failed), and meta.SetStatusCondition only
                      refreshes lastTransitionTime when the STATUS changes, not when the reason does. On a
                      forty-minute backup that is forty minutes of skew — enough to put a failure outside a
                      one-hour alert window it belongs inside, or inside one it has already left.

                  Written ONCE, on first arrival at a terminal phase, and never moved afterwards: a
                  re-reconcile of an already-terminal object must not restate when it finished.
                  ClusterBackupStatus.completionTime is the run-level sibling and means the same thing.
                format: date-time
                type: string
              conditions:
                description: conditions represent the current state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              hooks:
                description: |-
                  hooks records what each consistency hook did (R16). It is the durable account of the freeze
                  window: which pods were quiesced, whether the release ran, and — when it did not — what an
                  operator has to go and undo by hand.
                items:
                  description: HookStatus is one hook execution's durable record.
                  properties:
                    container:
                      type: string
                    finishedAt:
                      description: finishedAt is when the execution ended.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message carries the failure, including the command's own stderr — usually the whole
                        diagnosis. Empty on success.
                      maxLength: 1024
                      type: string
                    phase:
                      description: 'phase the hook ran in: "pre" (before snapshotting)
                        or "post" (after every snapshot was cut).'
                      enum:
                      - pre
                      - post
                      type: string
                    pod:
                      description: pod the command ran in, and container within it.
                      type: string
                    result:
                      description: result of the execution.
                      enum:
                      - Succeeded
                      - Failed
                      - Skipped
                      type: string
                    source:
                      description: 'source records where the hook was declared: an
                        annotation on the pod itself, or the CR spec.'
                      enum:
                      - annotation
                      - spec
                      type: string
                  required:
                  - phase
                  - pod
                  - result
                  type: object
                maxItems: 64
                type: array
              manifests:
                description: manifests records the namespace-manifests snapshot.
                properties:
                  resourceCount:
                    description: resourceCount captured.
                    format: int32
                    type: integer
                  snapshotID:
                    description: snapshotID of the manifests snapshot.
                    type: string
                type: object
              phase:
                description: phase of the backup.
                enum:
                - Pending
                - SnapshottingHooks
                - Snapshotting
                - Uploading
                - Completed
                - PartiallyCompleted
                - PartiallyFailed
                - Failed
                type: string
              postHookAttempts:
                description: |-
                  postHookAttempts counts how many times the post-hook (unfreeze) phase has been tried. Post
                  hooks are retried where pre hooks are not, and the asymmetry is deliberate: a failed pre hook
                  means the snapshot should not be taken, while a failed post hook means an application may
                  still be QUIESCED. Retrying is the difference between a transient blip and an outage.
                format: int32
                type: integer
              volumes:
                description: volumes is the per-PVC result set.
                items:
                  description: VolumeStatus is the per-PVC result within a Backup
                    projection.
                  properties:
                    addedBytes:
                      description: addedBytes is the deduplicated bytes added by this
                        backup (best-effort).
                      format: int64
                      type: integer
                    node:
                      description: node the mover ran on.
                      type: string
                    phase:
                      description: phase of this volume.
                      enum:
                      - Pending
                      - Snapshotting
                      - Uploading
                      - Completed
                      - Skipped
                      - Failed
                      type: string
                    pvc:
                      description: pvc name.
                      type: string
                    reason:
                      description: reason explains a non-Completed phase (e.g. CSISnapshotUnsupported).
                      type: string
                    sizeBytes:
                      description: sizeBytes is the logical size of the snapshot.
                      format: int64
                      type: integer
                    snapshotID:
                      description: snapshotID of the PVC data snapshot.
                      type: string
                  required:
                  - pvc
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
