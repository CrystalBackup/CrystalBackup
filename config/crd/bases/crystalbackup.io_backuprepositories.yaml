---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: backuprepositories.crystalbackup.io
spec:
  group: crystalbackup.io
  names:
    kind: BackupRepository
    listKind: BackupRepositoryList
    plural: backuprepositories
    shortNames:
    - br
    singular: backuprepository
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.scope
      name: Scope
      type: string
    - jsonPath: .status.initialized
      name: Initialized
      type: boolean
    - jsonPath: .status.repositoryURL
      name: URL
      type: string
    - jsonPath: .status.snapshotCount
      name: Snapshots
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: BackupRepository is the operator-internal state and inventory
          of one restic repository.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of BackupRepository
            type: object
          status:
            description: status defines the observed state of BackupRepository
            properties:
              approximateSizeBytes:
                description: |-
                  approximateSizeBytes is the repository's PHYSICAL size: the sum of the objects actually
                  stored under its prefix, post-dedup and post-compression. For the shared cluster
                  repository that is the whole cluster's footprint in that bucket, all namespaces together.
                format: int64
                type: integer
              conditions:
                description: conditions represent the current state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              initialized:
                description: initialized is true once restic init has succeeded.
                type: boolean
              keySlots:
                description: 'keySlots present in the repository (cluster: [platform];
                  tenant: [tenant] (+platform)).'
                items:
                  type: string
                type: array
              lastCheckResult:
                description: |-
                  lastCheckResult of the most recent check. Failed means restic found repository damage
                  (R17) — it is the RepositoryCheckFailed alert, not a transient error.
                enum:
                - Passed
                - Failed
                type: string
              lastCheckTime:
                description: |-
                  lastCheckTime is when restic check last ran — success or failure, unlike
                  lastMaintenanceTime. Paired with lastCheckResult it distinguishes "verified recently and
                  it was bad" from "not verified in weeks", which are different incidents.
                format: date-time
                type: string
              lastDiscoverySuccess:
                description: |-
                  lastDiscoverySuccess records whether the last discovery attempt finished cleanly: it
                  listed the repository AND reconciled every snapshot group into a Backup projection. A
                  partial pass — inventory recorded, some namespaces refusing their projection — is FALSE,
                  because what a reader of this field wants to know is whether `kubectl get backups` can
                  still be trusted against the repository, and after a partial pass it cannot.

                  A POINTER, so that "never attempted" is distinguishable from "attempted and failed". The
                  distinction is load-bearing: the DiscoveryFailed alert fires on the metric derived from
                  this field being 0, and a bool defaulting to false would page for every location between
                  its creation and its first scan.
                type: boolean
              lastDiscoveryTime:
                description: lastDiscoveryTime is when the repository was last inventoried.
                format: date-time
                type: string
              lastMaintenanceTime:
                description: |-
                  lastMaintenanceTime is when prune last SUCCEEDED. A failed prune deliberately leaves it
                  alone: the field answers "how long since this repository was actually reclaimed", and the
                  staleness alert depends on a failure not refreshing it.
                format: date-time
                type: string
              location:
                description: location the repository backs.
                properties:
                  kind:
                    description: kind of the referenced location.
                    enum:
                    - ClusterBackupLocation
                    - BackupLocation
                    type: string
                  name:
                    description: name of the referenced location.
                    type: string
                type: object
              mode:
                description: mode of the repository.
                enum:
                - Standard
                - Immutable
                type: string
              namespacesPresent:
                description: namespacesPresent is the count of distinct namespace
                  tags found.
                format: int32
                type: integer
              orphanSnapshots:
                description: |-
                  orphanSnapshots is how many snapshot (namespace, run) groups the last scan found whose
                  namespace does NOT exist. They are not projected and are restorable only through a
                  ClusterRestore. A non-zero value is DR data for gone namespaces — the repository outliving
                  the cluster is the design (adr/0009), not a fault — so nothing alerts on it; it is here so
                  an admin can see how much of the repository has no in-cluster representation.
                format: int32
                type: integer
              ownerNamespace:
                description: ownerNamespace is set for a namespaced (tenant) repository.
                type: string
              projectedBackups:
                description: |-
                  projectedBackups is how many snapshot (namespace, run) groups the last scan projected into
                  namespaces that exist — i.e. exactly what `kubectl get backups` lists for this repository
                  (CR lifetime = data lifetime, R26).
                format: int32
                type: integer
              recentMaintenance:
                description: |-
                  recentMaintenance is a capped, NEWEST-FIRST history of maintenance attempts. The
                  maintenance Job and its pod are deleted as soon as an op finishes, so this is the only
                  durable record of what ran and why it failed.
                items:
                  description: |-
                    MaintenanceRecord is one completed repository-maintenance attempt, kept so an operator can see
                    WHY a repository is unhealthy without going to the operator log — the maintenance Job and its
                    pod are deleted as soon as the op finishes (no ownerReference is possible: the Job lives in the
                    operator namespace, the triggering object does not), so this record is the only durable trace.
                  properties:
                    completionTime:
                      description: completionTime is when it finished. Absent while
                        it is still running.
                      format: date-time
                      type: string
                    message:
                      description: message carries the failure reason, truncated.
                        Empty on success.
                      maxLength: 512
                      type: string
                    operation:
                      description: operation that ran, e.g. "prune" or "check".
                      type: string
                    result:
                      description: result of the attempt.
                      enum:
                      - Succeeded
                      - Failed
                      type: string
                    startTime:
                      description: |-
                        startTime is when the operation was enqueued on the repository's exclusive lane. It
                        deliberately INCLUDES the wait for its turn: "the prune took three hours" is the number an
                        operator needs, and the lane is exactly where contention shows up.
                      format: date-time
                      type: string
                  required:
                  - operation
                  - startTime
                  type: object
                maxItems: 10
                type: array
              repositoryURL:
                description: repositoryURL is the restic repository URL (published
                  for the standalone CLI, R8).
                type: string
              scope:
                description: scope of the backing location.
                enum:
                - Cluster
                - Namespaced
                type: string
              snapshotCount:
                description: snapshotCount in the repository.
                format: int32
                type: integer
              staleLocks:
                description: |-
                  staleLocks is the number of repository lock objects older than restic's 30-minute
                  staleness threshold. Normally zero: a hard-killed mover's lock is cleared by an unlock op.
                  A persistent non-zero value means locks are accumulating faster than they are reaped, and
                  every exclusive operation will eventually stall behind them.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
