# promtool unit tests — the four rules whose bound is a number: StaleLocks, ErasureBlocked,
# PVCSnapshotPileup and BackupFailed.
#
# Each gets three shapes: one that fires, one sitting exactly ON the threshold that must not (every
# one of these is a strict `>`, and off-by-one on a `>` is a rule that pages a bucket early or a day
# late), and one that crosses the threshold but recovers inside the `for:` hold.
#
# BackupFailed is the odd one out and gets the most attention: it is the only rule here that reads
# two series, and it does because neither could carry it alone. It has no `for:` — the 1h range IS
# the hold — and it has to survive an operator restart, which is where the interesting cases are.
#
# The restart is NOT a counter reset. That belief was written into this file as a design
# justification and it was wrong: a CounterVec child only exists once something increments it, so a
# restarted operator publishes no `crystalbackup_backup_failures_total` series at all until the
# next failure. The series does not return to zero, it stops — and increase() sees across a reset
# but not across a disappearance. `crystalbackup_backup_last_failure_timestamp_seconds` is the state-derived
# companion that closes it, and the cases below model the disappearance faithfully rather than as
# a dip.
rule_files:
  - ../../../charts/crystal-backup/rules/crystalbackup.rules.yaml

evaluation_interval: 1m

tests:
  # ── CrystalbackupStaleLocks ───────────────────────────────────────────────
  - interval: 1m
    name: stale locks persisting past the reaper's budget
    input_series:
      - series: 'crystalbackup_repository_stale_locks{location="dr",scope="cluster",namespace="",cluster="prod"}'
        values: "2x60"
    alert_rule_test:
      - eval_time: 25m
        alertname: CrystalbackupStaleLocks
        exp_alerts: []
      - eval_time: 35m
        alertname: CrystalbackupStaleLocks
        exp_alerts:
          - exp_labels:
              severity: warning
              location: dr
              scope: cluster
              cluster: prod
            exp_annotations:
              summary: "Stale restic locks persist on dr (reaper not clearing)"
              description: "Stale locks block backups and maintenance on this repository. The orphan reaper normally clears them within minutes; 30 minutes of persistence means it is not running or cannot reach the backend."

  # Zero locks is the ordinary state of every repository in the fleet. `> 0` on a gauge that is
  # present and zero must be as silent as a gauge that is absent.
  - interval: 1m
    name: no stale locks — silent
    input_series:
      - series: 'crystalbackup_repository_stale_locks{location="dr",scope="cluster",namespace="",cluster="prod"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: CrystalbackupStaleLocks
        exp_alerts: []

  # The reaper doing its job: a lock appears, and is gone well inside the 30m hold. This is what
  # the hold is FOR — a backup that takes twenty minutes holds a lock for twenty minutes.
  - interval: 1m
    name: a lock the reaper clears inside the hold — never pages
    input_series:
      - series: 'crystalbackup_repository_stale_locks{location="dr",scope="cluster",namespace="",cluster="prod"}'
        values: "0x5 1x20 0x40"
    alert_rule_test:
      - eval_time: 26m
        alertname: CrystalbackupStaleLocks
        exp_alerts: []
      - eval_time: 60m
        alertname: CrystalbackupStaleLocks
        exp_alerts: []

  # ── CrystalbackupErasureBlocked ───────────────────────────────────────────
  # The erasure family carries only (location, cluster) — no namespace, no scope. An alert that
  # arrived with a namespace label here would mean the collector changed shape underneath the rule.
  - interval: 1m
    name: an erasure parked behind an object-lock window
    input_series:
      - series: 'crystalbackup_erasure_blocked{location="immutable-eu",cluster="prod"}'
        values: "1x120"
    alert_rule_test:
      - eval_time: 50m
        alertname: CrystalbackupErasureBlocked
        exp_alerts: []
      - eval_time: 70m
        alertname: CrystalbackupErasureBlocked
        exp_alerts:
          - exp_labels:
              severity: warning
              location: immutable-eu
              cluster: prod
            exp_annotations:
              summary: "Right-to-erasure blocked on immutable-eu (Immutable object-lock not yet expired, R21/ADR 0005)"
              description: "A ClusterErasure cannot complete until the object-lock window expires. This is expected on Immutable locations, but it is a GDPR clock running: someone has to know."

  - interval: 1m
    name: nothing blocked — silent
    input_series:
      - series: 'crystalbackup_erasure_blocked{location="immutable-eu",cluster="prod"}'
        values: "0x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: CrystalbackupErasureBlocked
        exp_alerts: []

  # ── CrystalbackupPVCSnapshotPileup ────────────────────────────────────────
  # 20 exactly. The ceph-csi flatten threshold this rule exists for is a hard number, and `> 20`
  # rather than `>= 20` is a deliberate one-snapshot margin. A test that only ever used 25 would
  # never notice the comparison being loosened.
  - interval: 1m
    name: exactly 20 snapshots — on the threshold, not over it
    input_series:
      - series: 'crystalbackup_pvc_volumesnapshot_count{namespace="team-a",pvc="data-0",cluster="prod"}'
        values: "20x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: CrystalbackupPVCSnapshotPileup
        exp_alerts: []

  - interval: 1m
    name: 21 snapshots — one over, pages after the hold
    input_series:
      - series: 'crystalbackup_pvc_volumesnapshot_count{namespace="team-a",pvc="data-0",cluster="prod"}'
        values: "21x60"
    alert_rule_test:
      - eval_time: 25m
        alertname: CrystalbackupPVCSnapshotPileup
        exp_alerts: []
      - eval_time: 35m
        alertname: CrystalbackupPVCSnapshotPileup
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: team-a
              pvc: data-0
              cluster: prod
            exp_annotations:
              # $value is in the summary, so this also pins that the operator is shown the count
              # and not a bare "a PVC has too many snapshots".
              summary: "21 VolumeSnapshots piling up on PVC team-a/data-0 (ceph-csi flatten risk, ADR 0006)"
              description: "Snapshots are accumulating faster than they are released — usually a coexisting backup tool, or our own temp snapshots not being cleaned up. On ceph-csi this crosses the flatten threshold and stalls the volume."

  # Per-PVC cardinality is the documented exception in spec §2.9, and the reason it is worth paying
  # is that the alert names the ONE claim to go and look at. Two PVCs over the line must produce two
  # alerts, not one aggregate that says "somewhere in team-a".
  - interval: 1m
    name: two PVCs piling up — two separately addressable alerts
    input_series:
      - series: 'crystalbackup_pvc_volumesnapshot_count{namespace="team-a",pvc="data-0",cluster="prod"}'
        values: "30x60"
      - series: 'crystalbackup_pvc_volumesnapshot_count{namespace="team-b",pvc="data-1",cluster="prod"}'
        values: "40x60"
      - series: 'crystalbackup_pvc_volumesnapshot_count{namespace="team-b",pvc="data-2",cluster="prod"}'
        values: "3x60"
    alert_rule_test:
      - eval_time: 35m
        alertname: CrystalbackupPVCSnapshotPileup
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: team-a
              pvc: data-0
              cluster: prod
            exp_annotations:
              summary: "30 VolumeSnapshots piling up on PVC team-a/data-0 (ceph-csi flatten risk, ADR 0006)"
              description: "Snapshots are accumulating faster than they are released — usually a coexisting backup tool, or our own temp snapshots not being cleaned up. On ceph-csi this crosses the flatten threshold and stalls the volume."
          - exp_labels:
              severity: warning
              namespace: team-b
              pvc: data-1
              cluster: prod
            exp_annotations:
              summary: "40 VolumeSnapshots piling up on PVC team-b/data-1 (ceph-csi flatten risk, ADR 0006)"
              description: "Snapshots are accumulating faster than they are released — usually a coexisting backup tool, or our own temp snapshots not being cleaned up. On ceph-csi this crosses the flatten threshold and stalls the volume."

  # ── CrystalbackupBackupFailed ─────────────────────────────────────────────
  - interval: 1m
    name: a backup failure inside the last hour
    input_series:
      - series: 'crystalbackup_backup_failures_total{namespace="team-a",tenant="acme",schedule="nightly",origin="namespace",location="dr",cluster="prod"}'
        values: "0x20 1x60"
    alert_rule_test:
      - eval_time: 40m
        alertname: CrystalbackupBackupFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: team-a
              tenant: acme
              schedule: nightly
              origin: namespace
              location: dr
              cluster: prod
            exp_annotations:
              summary: "Backup failed for team-a/nightly"
              description: "At least one Backup reached Failed or PartiallyFailed in the last hour. kubectl get backups -n team-a shows which."

  # The counter never moves. This is the fleet's normal state and the case a `> 0` on a raw counter
  # (rather than on increase()) would get catastrophically wrong: a namespace that failed once, ever,
  # would page for the lifetime of the process.
  - interval: 1m
    name: a failure older than the window — silent
    input_series:
      - series: 'crystalbackup_backup_failures_total{namespace="team-a",tenant="acme",schedule="nightly",origin="namespace",location="dr",cluster="prod"}'
        values: "3x200"
    alert_rule_test:
      - eval_time: 180m
        alertname: CrystalbackupBackupFailed
        exp_alerts: []

  # An operator restart, modelled the way one actually happens.
  #
  # This case used to assert the opposite of the truth. It fed the counter "0x10 1x10 0x40" — a
  # series that DIPS back to zero and carries on — and concluded that increase() had covered the
  # restart. It had covered a counter RESET, which is a different event and the only one increase()
  # handles. A restarted operator does not publish a zero: a CounterVec child does not exist until
  # something increments it, so the new process publishes NO failures_total series at all until the
  # next failure. The series does not dip, it ENDS.
  #
  # Measured on a real cluster with a real Prometheus, after the operator pod was replaced:
  # `crystalbackup_backup_failures_total` returned zero series, and
  # `increase(crystalbackup_backup_failures_total[1h])` returned three series all equal to 0, while
  # a Backup had genuinely failed. The alert stayed silent, and this test said it would not.
  #
  # So the counter below simply runs out at t=20m and never resumes. That alone is the case the
  # first disjunct cannot see; promtool has no way to assert "this rule would be silent without
  # part of its expression", so what is asserted here is the fix — the alert fires anyway, carried
  # by crystalbackup_backup_last_failure_timestamp_seconds, which is state-derived and therefore rebuilt from the
  # surviving Backup object on the very first scrape of the new process. Delete the second disjunct
  # from rules.go and this case goes red; that is the check.
  - interval: 1m
    name: a failure that straddles an operator restart still counts
    input_series:
      # The counter does not exist until the failure — a CounterVec child materialises on its first
      # Inc(), so the series APPEARS at 1 rather than stepping up from 0. Then the process it lived
      # in is replaced and the series stops. Nothing publishes it again.
      #
      # Both halves of that are why increase() reads 0 here. A series whose samples in the window
      # are all 1 has no rise to measure, and there is nothing after t=20m to compare against.
      - series: 'crystalbackup_backup_failures_total{namespace="team-a",tenant="acme",schedule="nightly",origin="namespace",location="dr",cluster="prod"}'
        values: "_x10 1x10"
      # The state-derived companion, present across the restart because it is recomputed from the
      # Backup object rather than remembered. 600 is the failure's completionTime in promtool's
      # epoch-based clock: t=10m, the same instant the counter moved.
      - series: 'crystalbackup_backup_last_failure_timestamp_seconds{namespace="team-a",tenant="acme",schedule="nightly",origin="namespace",location="dr",cluster="prod"}'
        values: "600x70"
    alert_rule_test:
      - eval_time: 55m
        alertname: CrystalbackupBackupFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: team-a
              tenant: acme
              schedule: nightly
              origin: namespace
              location: dr
              cluster: prod
            exp_annotations:
              summary: "Backup failed for team-a/nightly"
              description: "At least one Backup reached Failed or PartiallyFailed in the last hour. kubectl get backups -n team-a shows which."

  # The widest case, and the one that has nothing to do with restarts.
  #
  # A CounterVec child materialises AT ONE. There is no pre-registered zero: RecordBackupTerminal
  # only touches the child on the failure branch, so the very first failure of a (namespace,
  # schedule) series does not step 0 -> 1, it appears at 1 and stays there. increase() measures a
  # RISE between samples, and a window whose samples all read 1 contains no rise. The extrapolation
  # that rescues a partially-covered range does not help either: it scales a delta, and the delta
  # is zero.
  #
  # So the counter disjunct has never been able to page the FIRST failure a series ever records,
  # with the process up the whole time and nothing restarted. Only the second failure moves it.
  # That is the common shape of the incident an operator actually wants — a namespace that was fine
  # yesterday and failed once tonight — and it was silent.
  #
  # Both halves are pinned below. The first is the defect, still true of the counter and now
  # covered by the state-derived disjunct; the second proves the counter is not simply inert and
  # that the first case is about the rise, not about the series being unreadable.
  - interval: 1m
    name: the first failure a series ever records — carried by last_failure, not by the counter
    input_series:
      - series: 'crystalbackup_backup_failures_total{namespace="team-a",tenant="acme",schedule="nightly",origin="namespace",location="dr",cluster="prod"}'
        values: "_x10 1x50"
      - series: 'crystalbackup_backup_last_failure_timestamp_seconds{namespace="team-a",tenant="acme",schedule="nightly",origin="namespace",location="dr",cluster="prod"}'
        values: "600x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: CrystalbackupBackupFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: team-a
              tenant: acme
              schedule: nightly
              origin: namespace
              location: dr
              cluster: prod
            exp_annotations:
              summary: "Backup failed for team-a/nightly"
              description: "At least one Backup reached Failed or PartiallyFailed in the last hour. kubectl get backups -n team-a shows which."

  # The counter alone, on a SECOND failure — the one shape it can see. Remove the last_failure
  # series from the case above and it goes silent; keep the rise here and the counter carries it
  # unaided. The pair is what distinguishes "increase() cannot read this series" (false) from
  # "increase() needs a rise and a first failure has none" (true).
  - interval: 1m
    name: a second failure moves the counter, and the counter alone is enough
    input_series:
      - series: 'crystalbackup_backup_failures_total{namespace="team-a",tenant="acme",schedule="nightly",origin="namespace",location="dr",cluster="prod"}'
        values: "_x10 1x10 2x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: CrystalbackupBackupFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: team-a
              tenant: acme
              schedule: nightly
              origin: namespace
              location: dr
              cluster: prod
            exp_annotations:
              summary: "Backup failed for team-a/nightly"
              description: "At least one Backup reached Failed or PartiallyFailed in the last hour. kubectl get backups -n team-a shows which."

  # The other half of the restart fix, and the reason the second disjunct is a RECENCY test rather
  # than the plain `crystalbackup_backup_failures > 0` gauge.
  #
  # That gauge also survives a restart, and it was rejected: it counts failed Backups that still
  # exist, with no notion of when they failed. A Backup deliberately retained for diagnosis after
  # failing three days ago would page on every evaluation until somebody deleted it — which trains
  # an operator to silence the rule, the worst outcome an alert can have. Here the Backup failed at
  # t=10m and is still there, the counter series is long gone with the process that owned it, and
  # from 90 minutes on the alert says nothing — for as long as the object is kept.
  - interval: 1m
    name: a retained failure older than the window — silent, and does not page forever
    input_series:
      - series: 'crystalbackup_backup_last_failure_timestamp_seconds{namespace="team-a",tenant="acme",schedule="nightly",origin="namespace",location="dr",cluster="prod"}'
        values: "600x200"
    alert_rule_test:
      - eval_time: 100m
        alertname: CrystalbackupBackupFailed
        exp_alerts: []
      - eval_time: 180m
        alertname: CrystalbackupBackupFailed
        exp_alerts: []

  # The healthy fleet, which is every series most of the time, and the case an `or` is most likely
  # to break. The collector emits NO last_failure series for a namespace that has never failed —
  # absence, not a zero — precisely because a zero would put the Unix epoch on the wire and
  # `time() - 0` is fifty-four years. What is pinned here is that shape: a counter sitting flat at
  # zero, no last_failure series at all, and silence.
  - interval: 1m
    name: a series that has never failed emits no last_failure at all — silent
    input_series:
      - series: 'crystalbackup_backup_failures_total{namespace="team-a",tenant="acme",schedule="nightly",origin="namespace",location="dr",cluster="prod"}'
        values: "0x200"
    alert_rule_test:
      - eval_time: 60m
        alertname: CrystalbackupBackupFailed
        exp_alerts: []
      - eval_time: 180m
        alertname: CrystalbackupBackupFailed
        exp_alerts: []

  # A cluster-plane schedule reaches the same namespace with origin=cluster. Both planes have to
  # page, and they have to be distinguishable — the operator's first question on a missed backup is
  # "which schedule", and origin is half of that answer.
  - interval: 1m
    name: both planes page separately for the same namespace
    input_series:
      - series: 'crystalbackup_backup_failures_total{namespace="team-a",tenant="acme",schedule="nightly",origin="namespace",location="dr",cluster="prod"}'
        values: "0x20 1x60"
      - series: 'crystalbackup_backup_failures_total{namespace="team-a",tenant="acme",schedule="fleet-wide",origin="cluster",location="dr",cluster="prod"}'
        values: "0x20 1x60"
    alert_rule_test:
      - eval_time: 40m
        alertname: CrystalbackupBackupFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: team-a
              tenant: acme
              schedule: fleet-wide
              origin: cluster
              location: dr
              cluster: prod
            exp_annotations:
              summary: "Backup failed for team-a/fleet-wide"
              description: "At least one Backup reached Failed or PartiallyFailed in the last hour. kubectl get backups -n team-a shows which."
          - exp_labels:
              severity: warning
              namespace: team-a
              tenant: acme
              schedule: nightly
              origin: namespace
              location: dr
              cluster: prod
            exp_annotations:
              summary: "Backup failed for team-a/nightly"
              description: "At least one Backup reached Failed or PartiallyFailed in the last hour. kubectl get backups -n team-a shows which."
