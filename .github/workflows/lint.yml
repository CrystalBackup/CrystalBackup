name: Lint

on:
  push:
    branches: [main]
  pull_request:

# No token scopes granted by default; each job opts in to the minimum it needs.
permissions: {}

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      # `make lint` builds the custom golangci-lint binary declared in .custom-gcl.yml
      # (adds the logcheck module plugin) before running it.
      - name: Verify linter configuration
        run: make lint-config

      - name: Run golangci-lint
        run: make lint

  verify-generated:
    name: Generated code & CRDs up to date
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      # Regenerate CRDs/RBAC (config/) and DeepCopy code (api/) from the +kubebuilder
      # markers. The tree must already contain the up-to-date output.
      - name: Regenerate manifests and deepcopy
        run: make manifests generate

      # `git add -N` promotes any *new* generated-but-uncommitted file into the diff,
      # so this also catches a freshly scaffolded CRD that was never committed.
      - name: Verify api/ and config/ are committed
        run: |
          git add -N api config
          if ! git diff --exit-code -- api config; then
            echo "::error::Generated code / CRDs are out of date. Run 'make manifests generate' and commit the resulting changes under api/ and config/."
            exit 1
          fi

      # The chart's alert rules are generated from internal/alerts/rules.go, where every
      # expression is built from the internal/metrics/names.go constants. A stale committed
      # file would mean the chart ships the previous release's rules while the Go source
      # says otherwise — the same divergence between rule text and metric definitions that
      # let five of the nine rules ship unable to fire, moved one step downstream.
      - name: Verify the chart's alert rules are regenerated
        run: make alert-rules-verify

      # The site's Metrics and Alerts reference pages are generated from the same two sources:
      # the prometheus.Desc values internal/metrics registers, and the rule table in
      # internal/alerts. Fifty-three series and eleven rules maintained by hand drift within one
      # release, and a metrics reference that disagrees with a scrape is worse than none — it
      # sends a reader to write an alert on a label nothing emits, which is valid PromQL that
      # matches nothing, forever, in silence. Exactly the defect this milestone removed from the
      # rules; a stale page would put it back one step further from the code.
      - name: Verify the Metrics and Alerts reference pages are regenerated
        run: make observability-docs-verify

      # The mover sizing reference (docs/MOVER-RESOURCES.md) is generated from the one table that
      # sizes every mover Job. The chart ships no defaults of its own, so this page is where an
      # administrator reads the numbers before sizing a node pool — and a stale one would have
      # them plan against limits the operator no longer applies.
      - name: Verify the mover sizing reference is regenerated
        run: make mover-profiles-verify

      # The preflight script an administrator runs BEFORE installing anything answers, per
      # StorageClass, which exposer would be chosen and which volumes would be skipped. That
      # answer belongs to internal/exposer.Registry.For alone, so the script's routing block is
      # generated from it — and the generator does more than restate the constants: it executes
      # the real Registry.For against a fake cluster and refuses to emit a rule that disagrees,
      # and it fails outright on an exposer Kind it has no verdict for. A stale block here is the
      # worst-placed drift in the project: it is the one artefact strangers run against their own
      # clusters, and it would keep printing confident verdicts while being wrong.
      #
      # The published SHA-256 sidecar is checked by the same target. A checksum that no longer
      # matches the script does not fail quietly — it fails in the hands of the one administrator
      # who followed the documentation and verified before running.
      - name: Verify the preflight script and its checksum are regenerated
        run: make preflight-table-verify

  alert-rules:
    name: Alert rules parse and fire
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # No Go toolchain and no Helm: `make promtool` fetches the pinned Prometheus release archive
      # and verifies it against a SHA-256 committed in the Makefile, and everything below runs off
      # the generated YAML in the checkout. Until M6 this check existed as `check-alert-rules` and
      # skipped itself whenever promtool was absent from PATH — which, on every CI runner ever used
      # by this project, was always.
      - name: Syntax-check the PromQL and the annotation templates
        run: make check-alert-rules

      # The one that matters. `promtool check rules` proves the expressions PARSE; five of the nine
      # rules that shipped before M6 parsed perfectly and could never fire, because they read series
      # the operator does not emit. These unit tests feed each rule synthetic series and assert both
      # directions — it fires when it should, and it stays quiet when it should not, including the
      # absence cases where silence is the specified behaviour.
      #
      # The target also fails when a rule has no test at all: an untested rule passes a rule-test
      # run by not being mentioned in it, which is the same silence in a new costume.
      - name: Evaluate every rule against synthetic series
        run: make test-alert-rules

  helm-lint:
    name: helm lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.21.3

      - name: Lint chart
        run: helm lint charts/crystal-backup

  dashboards:
    name: Grafana dashboards match the metric catalogue
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The checker is stdlib-only (no pip install), but pin the interpreter rather than
      # inherit whatever the runner image happens to ship.
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"

      # The dashboards are JSON, so no Go build can notice a panel querying a series the
      # operator never emits: it renders "No data", which on a backup dashboard is
      # indistinguishable from "nothing to report". This job makes internal/metrics/names.go
      # the authority for the series names, the label sets AND the enum label values used in
      # every dashboard query. It needs no Go toolchain and no Helm — just the checkout.
      - name: Verify dashboard series, labels and label values
        run: make check-dashboards
