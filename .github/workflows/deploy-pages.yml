name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # website/public/preflight.sh and website/public/snapshot-probe.sh are published for
      # administrators to download and run against their own clusters. This project signs its
      # images, publishes SBOMs and SLSA provenance, and has already been bitten once by a
      # signature that failed verification for four releases while the pipeline stayed green —
      # so the scripts get the same treatment as the images: a checksum the docs tell people to
      # check, and a keyless cosign blob signature they can actually verify.
      #
      # snapshot-probe.sh is the one that CREATES objects in the reader's cluster. Its header
      # tells them to verify the signature before running it, which is only worth saying if the
      # signature is actually there — so it is signed in the same loop, not as a follow-up.
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # Sign what is published, and refuse to publish a checksum that does not describe it. The
      # committed sidecars are regenerated and diffed by `make preflight-table-verify` in the
      # Lint workflow; re-checking them HERE, against the bytes about to be uploaded, is the
      # cheap half of the same lesson — verify the artefact, not the job that produced it.
      - name: Verify the committed checksums match the scripts being published
        working-directory: ./website/public
        run: sha256sum -c preflight.sh.sha256 snapshot-probe.sh.sha256

      - name: cosign — keyless-sign the published scripts
        env:
          COSIGN_YES: "true"
        working-directory: ./website/public
        run: |
          set -euo pipefail
          for s in preflight.sh snapshot-probe.sh; do
            cosign sign-blob --yes --bundle "$s.cosign.bundle" "$s"
          done

      # Sign-then-build, never build-then-sign: Astro copies website/public/ into the site at
      # build time, so the bundle must exist before the build or it never reaches the published
      # site — and its absence would be invisible, the deploy succeeding with an unsigned script.
      - name: Build Astro site
        uses: withastro/action@v3
        with:
          path: ./website
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
