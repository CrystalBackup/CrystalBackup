name: Unit tests

on:
  push:
    branches: [main]
  pull_request:

# No token scopes granted by default; each job opts in to the minimum it needs.
permissions: {}

jobs:
  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Go 1.25 per mise.toml (go = "1.25.6") and the toolchain the project targets.
      # GOTOOLCHAIN stays at its default (auto), so the module's own `go` directive is
      # honoured if it asks for a newer toolchain.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # `make test` regenerates manifests + deepcopy, runs fmt/vet, provisions envtest
      # binaries, then runs the unit suite writing coverage to ./cover.out (see Makefile).
      - name: Run unit tests
        run: make test

      # Publish coverage even when tests fail, so a red run is still diagnosable.
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: cover.out
          if-no-files-found: warn
          retention-days: 14
