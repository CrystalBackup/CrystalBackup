# CrystalBackup soak — the resident collector.
# SPDX-License-Identifier: Apache-2.0
#
# ---------------------------------------------------------------------------------------------
# WHAT THIS IS
#
#   One Deployment, one replica, one small PVC. It runs `crystal-backup soak-collect` — a
#   subcommand of the OPERATOR binary, not a new image — which stays resident for the two weeks
#   of the soak and keeps five streams:
#
#     * the operator's own /metrics, scraped on an interval and downsampled locally, so this kit
#       needs NO Prometheus and no retention policy on your side;
#     * Kubernetes Events, WATCHED rather than polled — they expire after about an hour, so a
#       daily job sees essentially none of them;
#     * high-water marks: peak memory per mover operation class, restic cache high-water, longest
#       prune, longest backup. These are what 0.6.1 could not prove: the shipped mover limits are
#       a ceiling against a runaway, not a measurement (internal/mover/profiles.go says so in as
#       many words), and only a resident sampler can catch a peak inside a pod that lives for
#       eleven minutes;
#     * a daily self-check, through the same code path as `crystal-backup selfcheck`;
#     * hourly CR state snapshots.
#
#   At the end you run ONE command and get ONE archive. See ../README.md.
#
# WHAT IT COSTS YOUR CLUSTER, STATED UP FRONT
#
#   One pod at 200m CPU / 384Mi memory, requests equal to limits. One 1Gi RWO volume, of which
#   the collector will use at most 512Mi (--max-bytes) and rotates the oldest data away rather
#   than growing. Cluster-wide READ-ONLY RBAC, held for the duration rather than for four seconds
#   a day — enumerated below, verb by verb, so you can read exactly what you are granting.
#
#   The one thing a soak collector must never do is cause the incident it was deployed to
#   observe. That is why the footprint is capped rather than trusted, why the data lives on a PVC
#   and never on the node's ephemeral disk, and why the resource requests are real. If your
#   default StorageClass is local-path or otherwise node-backed, that PVC IS node disk — the cap
#   is then the only thing standing between this and a DiskPressure eviction, so keep it.
#
# THE REDACTION SALT — --salt-method
#
#   Identifiers in the exported archive are HMAC tokens. The salt is what makes the same namespace
#   the same token on day 2 and on day 13, which is the entire product of a soak, so where it
#   comes from is a NAMED choice and not something inferred from which flags happen to be set:
#
#     --salt-method=auto          (DEFAULT)  derived from the operator namespace's UID
#     --salt-method=from-secret              read from a Secret you create
#     --redaction-salt-file=<path>           required by, and only by, from-secret
#
#   The collector prints which method it resolved on startup and records it in the archive's
#   manifest, so soak-export reproduces the same salt without being told.
#
#   auto derives SHA256("crystalbackup-soak-salt-v1" || the namespace UID). The UID is unique per
#   cluster, constant for the life of the namespace, and — the point — NOTHING GENERATES IT, so
#   there is nothing to lose and nothing to regenerate. A Secret can be deleted by a `helm
#   uninstall`, lost with a recreated namespace, or redone "to be safe"; when that happens
#   mid-soak the correlation breaks silently and you are left with seven days of tokens on one
#   side, seven on the other, and no way to join them.
#
#   Nothing should ever GENERATE this Secret for you, and that includes the chart when the
#   collector eventually moves into it. templates/webhook.yaml already explains why for the
#   certificate it does generate: "`lookup` would not fix it: Argo CD renders with `helm
#   template`, which has no cluster to look anything up in." A generated salt would change on
#   every refresh — three minutes by default — and it would be WORSE than the certificate,
#   because a new certificate rolls the Deployment and gets noticed while a new salt changes
#   nothing visible at all.
#
#   WHAT THE DERIVED SALT PROTECTS AGAINST, PLAINLY. Against a stranger reading a public issue,
#   the UID is 122 bits they do not have. Against anyone who can `get` the operator's namespace,
#   the tokens are REVERSIBLE BY DICTIONARY in seconds, because namespace names come from a small
#   guessable set. Every exported report says so in its own redaction block. If a report is
#   leaving the cluster for a wider audience, re-run it with no fixed salt at all.
#
# ORDER OF INSTALLATION
#
#   1. edit the image below to the digest your operator actually runs
#   2. kubectl apply -f collector.yaml
#   3. kubectl -n crystal-backup-system exec deploy/crystal-backup-soak -- \
#        /manager soak-export --status        # on day 1, and again on day 2
#
#   For --salt-method=from-secret, first:
#
#     openssl rand -out soak-salt.bin 32
#     kubectl -n crystal-backup-system create secret generic crystal-backup-soak-salt \
#       --from-file=salt=soak-salt.bin
#
#   then uncomment the --salt-method, volumeMounts and volumes blocks marked `from-secret` below.
#   KEEP soak-salt.bin on your own machine and DO NOT put it in the archive you send: with it,
#   every token is reversible in seconds by dictionary. Without it, by nobody — which is the one
#   thing from-secret buys over auto.
# ---------------------------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crystal-backup-soak
  namespace: crystal-backup-system
  labels:
    app.kubernetes.io/part-of: crystal-backup
    app.kubernetes.io/component: soak
automountServiceAccountToken: true
---
# The standing read grant. Read it as what it is: for two weeks, a pod in your cluster may LIST
# and WATCH these kinds cluster-wide. Every verb here is a read. There is no create, no update,
# no delete, no patch, no exec, no portforward, and no access to Secrets anywhere — the
# self-check collector does not read Secret objects (it reports the NAMES that appear in CR
# specs, which it gets from the specs).
#
# This is a SEPARATE identity from the operator's, and that is the opposite of the decision the
# earlier CronJob shape made. The reason is the standing part: a one-shot job that lives four
# seconds a day can borrow the operator's identity without meaningfully widening anything, but a
# process that holds a token for fourteen days should hold its own, so that revoking it is
# deleting one ClusterRoleBinding and not editing the operator's.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crystal-backup-soak-collector
  labels:
    app.kubernetes.io/part-of: crystal-backup
    app.kubernetes.io/component: soak
rules:
  # The product's own objects, and their status. This is the CR-state stream and most of the
  # self-check's inventory.
  - apiGroups: ["crystalbackup.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Namespaces (coverage), PVCs (the exposure and pileup story), pods (mover lifecycle, restarts,
  # OOM kills, evictions), events (the stream that expires), nodes (which node a mover landed on,
  # and its pressure conditions).
  - apiGroups: [""]
    resources: ["namespaces", "persistentvolumeclaims", "pods", "events", "nodes"]
    verbs: ["get", "list", "watch"]
  # The operator's own error-level log lines, read continuously from the API rather than scraped
  # off a node at the end. This is what makes the log stream survive the kubelet's rotation.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Mover Jobs: what a mover pod was DOING is on its Job, and without it a peak memory sample is
  # a number attributed to nothing.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  # The self-check reads these for its inventory and its snapshot-leak census.
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments"]
    verbs: ["get", "list"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots", "volumesnapshotcontents", "volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
  # Peak memory per mover, from metrics-server. If metrics-server is not installed the collector
  # records the high-water marks as NOT MEASURED — never as zero.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crystal-backup-soak-collector
  labels:
    app.kubernetes.io/part-of: crystal-backup
    app.kubernetes.io/component: soak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crystal-backup-soak-collector
subjects:
  - kind: ServiceAccount
    name: crystal-backup-soak
    namespace: crystal-backup-system
---
# /metrics on the operator is authenticated and authorized: the manager runs with
# --metrics-secure (the default) and controller-runtime's
# filters.WithAuthenticationAndAuthorization, so a scrape is a TokenReview followed by a
# SubjectAccessReview on the non-resource URL /metrics. The chart already ships the ClusterRole
# that answers it and deliberately binds it to nobody ("Scrapers bind this to read /metrics").
# This is that binding, for this one ServiceAccount.
#
# If your release was installed with a fullnameOverride, this ClusterRole is named
# <fullname>-metrics-reader instead; check with:
#   kubectl get clusterrole | grep metrics-reader
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crystal-backup-soak-metrics-reader
  labels:
    app.kubernetes.io/part-of: crystal-backup
    app.kubernetes.io/component: soak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crystal-backup-metrics-reader
subjects:
  - kind: ServiceAccount
    name: crystal-backup-soak
    namespace: crystal-backup-system
---
# OPT-IN, AND NOT BOUND BY THIS FILE.
#
# The restic cache high-water mark cannot be read from the API: the cache is an emptyDir inside a
# mover pod, and the only in-cluster source for its size is the kubelet's own stats/summary
# endpoint. Reaching it needs nodes/proxy, which is not a small grant — it is access to the
# kubelet API, and on most clusters that transitively includes running commands in containers.
# It is therefore written down here and left UNBOUND. Bind it only if you want the cache figure
# and are content with that grant for two weeks:
#
#   kubectl create clusterrolebinding crystal-backup-soak-kubelet-stats \
#     --clusterrole=crystal-backup-soak-kubelet-stats \
#     --serviceaccount=crystal-backup-system:crystal-backup-soak
#   # and add --kubelet-stats to the collector's args
#
# Without it the collector reports the cache high-water as NOT MEASURED and everything else
# unchanged. The 20Gi cache ceiling in internal/mover/profiles.go is explicitly "a CEILING
# AGAINST A RUNAWAY, not a sizing estimate", so measuring it is the point of the exercise — but
# not at the price of a grant you did not want to give.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crystal-backup-soak-kubelet-stats
  labels:
    app.kubernetes.io/part-of: crystal-backup
    app.kubernetes.io/component: soak
rules:
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
---
# 1Gi, of which the collector uses at most 512Mi.
#
# The sizing, since a number with no reasoning behind it is how a PVC ends up full: the metrics
# stream dominates, and it is bounded by (distinct series) × (points per day) × (bytes per
# point). A cluster with 40 protected namespaces emits on the order of a thousand crystalbackup_
# series; at one point per five minutes that is 288 points per series per day, ~20 bytes each
# gzipped — about 6 MB a day, 80 MB for a fortnight. Events, CR snapshots, error lines and the
# fourteen self-checks together are under 50 MB. 512Mi is therefore roughly five times the
# expected volume, and 1Gi leaves the filesystem room to breathe above the cap.
#
# A cluster ten times that size will hit the cap, and that is a designed outcome rather than an
# error: the collector drops the OLDEST day's raw samples and keeps the aggregates and the
# high-water marks, which are the part that cannot be reconstructed. What it never does is fill
# the volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crystal-backup-soak-data
  namespace: crystal-backup-system
  labels:
    app.kubernetes.io/part-of: crystal-backup
    app.kubernetes.io/component: soak
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
  # storageClassName: <yours>   # left unset: the cluster default is the right choice here, and
  # naming one would be wrong on every cluster but the one this was written on.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crystal-backup-soak
  namespace: crystal-backup-system
  labels:
    app.kubernetes.io/part-of: crystal-backup
    app.kubernetes.io/component: soak
    crystalbackup.io/soak: collector
spec:
  replicas: 1
  # Recreate, not RollingUpdate. The volume is ReadWriteOnce: a rolling update would start the
  # new pod before the old one released the PVC, and it would sit Pending on a multi-attach error
  # until someone noticed — with the soak silently stopped in the meantime.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      crystalbackup.io/soak: collector
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: crystal-backup
        # NOT control-plane: controller-manager — that is the operator metrics Service's
        # selector, and wearing it would make this pod a scrape target serving no metrics.
        crystalbackup.io/soak: collector
    spec:
      serviceAccountName: crystal-backup-soak
      automountServiceAccountToken: true
      # No priorityClassName. Under node pressure this pod should not outrank the workload it is
      # measuring; its Guaranteed QoS already puts it behind Burstable and BestEffort pods in the
      # eviction order, which is the right place for it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          # MUST be the image your operator is actually running. A soak whose collector is a
          # different build from the operator under test describes a cluster that does not exist:
          #   kubectl -n crystal-backup-system get deploy crystal-backup \
          #     -o jsonpath='{.spec.template.spec.containers[0].image}'
          image: ghcr.io/crystalbackup/operator:0.6.1
          imagePullPolicy: IfNotPresent
          args:
            - soak-collect
            - --data-dir=/var/lib/crystal-backup-soak
            # The hard cap on the on-disk footprint. On reaching it the collector deletes the
            # oldest raw segment and records the drop in its own manifest, so an archive that
            # lost its first three days SAYS it lost its first three days.
            - --max-bytes=512Mi
            # The operator's metrics Service. Verify the name against your release:
            #   kubectl -n crystal-backup-system get svc | grep metrics
            - --metrics-url=https://crystal-backup-metrics.crystal-backup-system.svc:8443/metrics
            # The metrics server presents a self-signed certificate (the chart requires no
            # cert-manager, and the ServiceMonitor it ships sets insecureSkipVerify for the same
            # reason). This connection is pod-to-pod inside one namespace and is authenticated in
            # the direction that matters — the collector proves who it is with a bearer token.
            - --metrics-insecure-skip-verify
            - --metrics-interval=60s
            # Raw scrapes are NOT kept. Each series is reduced to one point per resolution
            # window, plus the min and max seen inside it, which is what keeps a fortnight of a
            # thousand series inside the cap while still showing a spike that lasted four minutes.
            - --metrics-resolution=5m
            # Mover pods are short-lived and their peak is what we came for. 15s is a compromise:
            # fast enough to catch the peak of an eleven-minute backup, slow enough that the
            # metrics-server load is negligible.
            - --mover-sample-interval=15s
            - --selfcheck-interval=24h
            - --state-interval=1h
            # Where the redaction salt comes from. `auto` is the default and needs no Secret:
            # the salt is derived from this namespace's UID, which nothing generates and nothing
            # can regenerate. Written out rather than left to the flag's default, because this is
            # the line somebody reads to find out what the archive's tokens promise.
            #
            # What lands on the PVC is UNREDACTED either way — it is your cluster's own data on
            # your own volume, and a token cannot be re-redacted afterwards. Redaction happens
            # once, at export, and soak-export re-derives the same salt from the manifest.
            - --salt-method=auto
            # from-secret: swap the line above for these two, and uncomment the `salt` volume and
            # volumeMount below. Passing --redaction-salt-file WITHOUT --salt-method=from-secret
            # is refused at startup rather than silently ignored.
            # - --salt-method=from-secret
            # - --redaction-salt-file=/etc/crystal-backup/soak/salt
            # Off by default; see the kubelet-stats ClusterRole above.
            # - --kubelet-stats
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # 80% of the limit. The operator learned this on its own mover Jobs: a Go process
            # with a memory limit and no GOMEMLIMIT grows into the cgroup ceiling and is killed
            # instead of collecting. A process that parses a metrics exposition every minute for
            # two weeks is exactly that shape.
            - name: GOMEMLIMIT
              value: "300MiB"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # requests == limits (Guaranteed). A collector evicted under node pressure loses
          # precisely the hours most worth having.
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 200m
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/crystal-backup-soak
            # from-secret only.
            # - name: salt
            #   mountPath: /etc/crystal-backup/soak
            #   readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            exec:
              # The collector touches this file every loop. A process that is alive but has
              # stopped collecting is the failure this probe exists for, and it is not one an
              # HTTP handler on the same process would ever catch.
              command:
                - /manager
                - soak-collect
                - --heartbeat-check
                - --data-dir=/var/lib/crystal-backup-soak
            initialDelaySeconds: 60
            periodSeconds: 300
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: crystal-backup-soak-data
        # from-secret only.
        # - name: salt
        #   secret:
        #     secretName: crystal-backup-soak-salt
        #     defaultMode: 0400
        #     items:
        #       - key: salt
        #         path: salt
        # readOnlyRootFilesystem: true, and the export builds its tarball as a stream — but Go's
        # tempdir has to exist somewhere.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
# The chart installs a default-deny NetworkPolicy over every pod in crystal-backup-system,
# including ones that did not exist when it was applied — this one. Without the two rules below
# the collector reaches neither the API server nor the operator's /metrics, and it would spend
# fourteen days recording that it could not see anything.
#
# Apply them whether or not you believe you have NetworkPolicies: they grant egress to the API
# server and to one port on one pod, so on a cluster without a default-deny they change nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crystal-backup-soak-egress
  namespace: crystal-backup-system
  labels:
    app.kubernetes.io/part-of: crystal-backup
    app.kubernetes.io/component: soak
spec:
  podSelector:
    matchLabels:
      crystalbackup.io/soak: collector
  policyTypes: [Egress]
  egress:
    # The API server. Both ports, because it is reached on 443 through the in-cluster Service on
    # most distributions and on 6443 on several others.
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
    # The operator's metrics port.
    - ports:
        - port: 8443
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              control-plane: controller-manager
---
# The operator's own policy allows ingress on the metrics port only from the namespace named in
# networkPolicy.monitoringNamespace, when one is named. NetworkPolicies are additive, so this
# adds the collector as a permitted source without touching the chart's policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crystal-backup-soak-metrics-ingress
  namespace: crystal-backup-system
  labels:
    app.kubernetes.io/part-of: crystal-backup
    app.kubernetes.io/component: soak
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8443
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              crystalbackup.io/soak: collector
